<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Note</title>
  <link rel="stylesheet" href="t.css">
</head>
<body>

  <div class="app">

    <header>
      <div class="top-bar">
        <span class="menu">☰</span>
        <h2>All Notes</h2>
        <div class="actions">
          <span>⌕</span>
          <span>▣</span>
        </div>
      </div>

      <div class="tabs">
        <button class="active">Notes</button>
        <button>Bookmark</button>
        <button>Reminder</button>
        <span class="filter">☷</span>
      </div>
    </header>

    <main id="notesContainer">

      <div class="note blue">
        <div>
          <h3>Marketing</h3>
          <p>24/04/2024</p>
          <small>✪ Tue. 17:36</small>
        </div>
        <div class="note-right">
          <span>10:30 PM</span>
          <b>⋮</b>
          <strong>★</strong>
        </div>
      </div>

      <div class="note pink">
        <div>
          <h3>Personal</h3>
          <p>22/04/2024</p>
        </div>
        <div class="note-right">
          <span>12:10 AM</span>
          <b>⋮</b>
        </div>
      </div>

      <div class="note green">
        <div>
          <h3>Shopping</h3>
          <p>20/04/2024</p>
        </div>
        <div class="note-right">
          <span>01:50 AM</span>
          <b>⋮</b>
        </div>
      </div>

      <div class="note yellow">
        <div>
          <h3>University Notes</h3>
          <p>18/04/2024</p>
        </div>
        <div class="note-right">
          <span>03:45 AM</span>
          <b>⋮</b>
        </div>
      </div>

      <div class="note cyan">
        <div>
          <h3>Personal</h3>
          <p>22/04/2024</p>
        </div>
        <div class="note-right">
          <span>12:10 AM</span>
          <b>⋮</b>
        </div>
      </div>

    </main>

    <button class="add-btn" id="addNote">＋</button>

  </div>

  <script src="t.js"></script>
</body>
</html>
